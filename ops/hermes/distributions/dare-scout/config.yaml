# Preserved on update — change the model here and it survives `hermes profile update`.

# Pinned deliberately. A profile with a provider and no model resolves to that
# provider's flagship, so leaving this blank is expensive, not neutral.
model:
  default: claude-haiku-4.5
  provider: anthropic

# Scouting is search-and-triage, so the agent gets memory, todo and skills — and
# reaches the web only through DARE's audited tools below. No terminal, no file
# access, no code execution: this agent reads the literature, it does not run
# anything.
platform_toolsets:
  api_server:
    - memory
    - skills
    - todo

# Tiered disclosure hides MCP tools behind `tool_search` and asks the model to
# go find them. That trade — a few hundred tokens against an extra hop — is
# wrong for an agent with exactly two tools, and it fails badly on cheaper
# models: observed one reading the tool catalogue as if it were the literature
# index and reporting "only 2 results, none matching" as a research finding.
# Show the tools directly.
tools:
  tool_search:
    enabled: false

mcp_servers:
  dare:
    url: ${DARE_MCP_GATEWAY_URL}
    transport: http
    enabled: true
    headers:
      Authorization: Bearer ${MCP_DARE_API_KEY}
