name: dare-scout
version: 0.1.0
description: >-
  DARE's literature scout — finds candidate sources through DARE's audited
  search and reader, so every page it opens is captured and attributable.
author: DARE (Carnegie Mellon University)
license: AGPL-3.0
hermes_requires: ">=0.19.0"

env_requires:
  - name: MCP_DARE_API_KEY
    description: >-
      A DARE access token for the scholar this agent works for. The scout reaches
      the web only through DARE's MCP gateway, so this token decides whose
      account the searches run under and who the captured pages are attributed
      to. Mint one in DARE under the account you want the reading credited to.
    required: true
  - name: DARE_MCP_GATEWAY_URL
    description: >-
      Your DARE backend's MCP gateway, e.g.
      https://dare.example.edu/mcp/api/gateway/. Must be reachable from the
      machine running the Hermes gateway, not from your browser.
    required: false
    default: "http://127.0.0.1:8000/mcp/api/gateway/"

# Everything else — memories/, sessions/, .env, auth.json — belongs to whoever
# installs this and is never touched by an update.
distribution_owned:
  - SOUL.md
  - skills/
